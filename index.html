<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时数据 - 聚水潭销售仪表盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    padding: 32px;
    min-height: 100vh;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
  }
  .header h1 {
    font-size: 22px;
    color: #1d2129;
    font-weight: 600;
  }
  .header .subtitle {
    font-size: 13px;
    color: #86909c;
    margin-top: 4px;
  }
  .refresh-btn {
    background: #ff6d41;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-btn:hover {
    background: #e55a2f;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(255,109,65,0.3);
  }
  .refresh-btn:active { transform: translateY(0); }
  .refresh-btn.spinning .refresh-icon { animation: spin 0.8s linear; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .refresh-icon { display: inline-block; width: 16px; height: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    transform: translateY(-2px);
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  /* 文字 Logo（div）保持方形 */
  div.card-logo {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }
  /* 图片 Logo（img）使用横向矩形，保持比例不变形 */
  img.card-logo {
    width: 96px;
    height: 56px;
    border-radius: 10px;
    object-fit: contain;
    object-position: left center;
    flex-shrink: 0;
    background: #fff;
    padding: 0;
    margin-bottom: 0;
  }
  .card-name {
    font-size: 15px;
    font-weight: 600;
    color: #1d2129;
    line-height: 1.3;
  }
  .card-metric { margin-bottom: 16px; }
  .card-metric:last-child { margin-bottom: 0; }
  .metric-label {
    font-size: 13px;
    color: #86909c;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .metric-label .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .metric-value {
    font-size: 28px;
    font-weight: 700;
    color: #1d2129;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .metric-value .unit {
    font-size: 14px;
    font-weight: 400;
    color: #86909c;
    margin-left: 4px;
  }
  .metric-divider {
    height: 1px;
    background: #e5e6eb;
    margin: 16px 0;
  }
  .card--pdd { --accent: #ff5500; --accent-light: #ff8c44; }
  .card--shop1 { --accent: #4f6ef7; --accent-light: #7b93fa; }
  .card--shop2 { --accent: #00b42a; --accent-light: #23d160; }
  .card--shop3 { --accent: #f7ba2a; --accent-light: #fcd66d; }
  .card--jd    { --accent: #e2231a; --accent-light: #f55c43; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>实时数据</h1>
    <div class="subtitle" id="updateTime"></div>

      <polyline points="23 4 23 10 17 10"></polyline>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
    </svg>
    刷新
  </button>
  <span id="statusMsg" style="font-size:12px; color:#ff6d41; margin-left:10px; min-width:80px;"></span>
</div>

function formatAmount(n) {
  return '\u00a5' + n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderCards() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  STORES.forEach((store, i) => {
    const card = document.createElement('div');
    card.className = 'card ' + store.cls;
    let logoHtml;
    if (store.logo) {
      logoHtml = '<img class="card-logo" src="' + store.logo + '" alt="' + store.name + '" />';
    } else {
      logoHtml = '<div class="card-logo">' + store.name.substring(0, 2) + '</div>';
    }
    let nameHtml = store.logo ? '' : '<div class="card-name">' + store.name + '</div>';
    card.innerHTML =
      '<div class="card-header">' +
        logoHtml +
        nameHtml +
      '</div>' +
      '<div class="card-metric">' +
        '<div class="metric-label"><span class="dot"></span>本月订单量</div>' +
        '<div class="metric-value" id="orders-' + i + '">0<span class="unit">单</span></div>' +
      '</div>' +
      '<div class="metric-divider"></div>' +
      '<div class="card-metric">' +
        '<div class="metric-label"><span class="dot"></span>本月销售额</div>' +
        '<div class="metric-value" id="amount-' + i + '">\u00a50.00</div>' +
      '</div>';
    grid.appendChild(card);
  });
  updateTime();
  setTimeout(() => {
    STORES.forEach((store, i) => {
      animateNumber('orders-' + i, 0, store.orders, 'orders');
      animateNumber('amount-' + i, 0, store.amount, 'amount');
    });
  }, 200);
}

function updateTime() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  const h = String(now.getHours()).padStart(2, '0');
  const min = String(now.getMinutes()).padStart(2, '0');
  const sec = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('updateTime').textContent = '\u6570\u636e\u66f4\u65b0\u65f6\u95f4\u003a' + y + '-' + m + '-' + d + ' ' + h + ':' + min + ':' + sec;
}

function animateNumber(elementId, from, to, type) {
  const el = document.getElementById(elementId);
  if (!el) return;
  const duration = 1200;
  const start = performance.now();
  let fromNum = parseFloat(String(from).replace(/[\u00a5,]/g, '')) || 0;
  let toNum = parseFloat(String(to).replace(/[\u00a5,]/g, '')) || 0;
  const isAmount = type === 'amount';
  function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }
  function formatCurrent(val) {
    if (isAmount) return '\u00a5' + val.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return Math.round(val).toLocaleString('zh-CN') + '<span class="unit">\u5355</span>';
  }
  function step(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const easedProgress = easeOutExpo(progress);
    const current = fromNum + (toNum - fromNum) * easedProgress;
    el.innerHTML = formatCurrent(current);
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

const LOCAL_SERVER = 'http://localhost:8765';
const SERVER_SECRET = 'jst2026';
const POLL_INTERVAL = 2000; // 提速：每 2 秒检查一次
const MAX_POLL = 120;
// =========================================

function triggerLocalFetch() {
  return fetch(`${LOCAL_SERVER}/api/refresh?token=${SERVER_SECRET}`)
    .then(resp => resp.json());
}

function pollFetchStatus() {
  return fetch(`${LOCAL_SERVER}/api/status`)
    .then(resp => resp.json());
}

function loadData() {
  // ★ 修复：直接从本地服务获取最新数据，绕过 GitHub CDN 缓存延迟
  return fetch(`${LOCAL_SERVER}/api/data`)
    .then(resp => resp.json())
    .then(result => {
      if (result.error) { console.error(result.error); return false; }
      const data = result.data;
      const storeKeys = ['pdd', 'taobao', 'douyin', 'xhs'];
      storeKeys.forEach((key, i) => {
        if (data[key] && STORES[i]) {
          STORES[i].orders = data[key].orders;
          STORES[i].amount = data[key].amount;
        }
      });
      return true;
    })
    .catch(e => { console.error('loadData error:', e); return false; });
}

function doRefresh() {
  const btn = document.getElementById('refreshBtn');
  const msg = document.getElementById('statusMsg');
  btn.classList.add('spinning');
  btn.textContent = '触发中...';
  msg.textContent = '';

  fetch(`${LOCAL_SERVER}/health`, { mode: 'cors' })
    .then(resp => {
      if (!resp.ok) throw new Error('服务未响应');
      return triggerLocalFetch();
    })
    .then(result => {
      if (result.error) throw new Error(result.error);
      btn.textContent = '抓取中...';
      msg.textContent = '抓取中...';
      return pollCompletion(btn, msg);
    })
    .catch(err => {
      btn.classList.remove('spinning');
      btn.innerHTML = '<svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg> 刷新';
      msg.textContent = '';
      alert('触发失败: ' + err.message + '\n\n请确保本地服务正在运行（双击 start_refresh_server.bat）');
    });
}

function pollCompletion(btn, msg) {
  return new Promise((resolve, reject) => {
    let count = 0;
    function poll() {
      count++;
      if (count > MAX_POLL) {
        btn.classList.remove('spinning');
        btn.innerHTML = '<svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg> 刷新';
        msg.textContent = '超时，请手动刷新页面';
        reject(new Error('轮询超时'));
        return;
      }
      pollFetchStatus().then(status => {
        if (!status.is_fetching && status.last_result === 'success') {
          msg.textContent = '加载数据...';
          loadData().then(ok => {
            if (ok) {
              STORES.forEach((store, i) => {
                animateNumber('orders-' + i, 0, store.orders, 'orders');
                animateNumber('amount-' + i, 0, store.amount, 'amount');
              });
              updateTime();
              msg.textContent = '✓ 已更新';
            } else {
              msg.textContent = '加载失败，请刷新页面';
            }
            btn.classList.remove('spinning');
            btn.innerHTML = '<svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg> 刷新';
            resolve();
          });
        } else if (!status.is_fetching && status.last_result) {
          msg.textContent = '抓取失败: ' + status.last_result;
          btn.classList.remove('spinning');
          btn.innerHTML = '<svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg> 刷新';
          reject(new Error('抓取失败'));
        } else {
          setTimeout(poll, POLL_INTERVAL);
        }
      }).catch(() => setTimeout(poll, POLL_INTERVAL));
    }
    poll();
  });
}

  // 每 30 秒检查一次
  setInterval(checkForUpdates, 30000);
}

renderCards();
startAutoPoll();
startAutoPoll();
</script>
